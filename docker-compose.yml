services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookworm
    ports:
      - "5432:5432"
    volumes:
      - bookworm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookworm"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/bookworm
      SYNC_DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/bookworm
      JWT_SECRET: change-this-secret-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "10080"
      CORS_ORIGINS: http://localhost:5173,http://localhost,http://127.0.0.1:5173,http://127.0.0.1
      PUBLIC_BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  bookworm_pg_data:
